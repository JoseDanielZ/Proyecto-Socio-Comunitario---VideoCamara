# Configuración base del pipeline LPR.
# Cambiar source.type/path_or_url es lo único necesario para pasar
# de un video de prueba a una cámara real.

source:
  type: "file"                 # "file" | "rtsp"
  path_or_url: "data/videos/215295_medium.mp4"
  source_id: "camera_principal"
  loop: false                  # solo aplica a type: file; true = repetir el video sin fin
  reconnect_delay_seconds: 5.0
  max_reconnect_attempts: -1   # -1 = reintentar indefinidamente (para rtsp)

models:
  # Detector para vista aérea/cenital (dron): python -m lpr.download_models
  # Para cámara a nivel de calle usar "models/yolov8n.pt" (COCO) e imgsz: 640.
  vehicle_detector_weights: "models/geotrax_hbb_yolov8s_1920_v1.pt"
  vehicle_confidence_threshold: 0.25
  nms_threshold: 0.5
  imgsz: 1280
  # Nombres de clase del modelo elegido (no distingue mayúsculas).
  vehicle_classes: ["car", "bus", "truck", "motorcycle"]
  plate_ocr_enabled: false     # sin placas visibles en el video aéreo de prueba
  # fast-alpr usa sus propios modelos ONNX por defecto si se deja en null;
  # sobreescribir aquí solo si se usan modelos personalizados.
  plate_detector_model: null
  ocr_model: null

line_zones:
  - name: "linea_entrada_principal"
    start: [640, 0]              # línea vertical: el tráfico del video de prueba va de lado a lado
    end: [640, 720]
    in_label: "entrada"
    out_label: "salida"

database:
  path: "db/conteo_carretera.db"

snapshots:
  enabled: true
  directory: "data/snapshots"

runtime:
  preview: false
  log_level: "INFO"
