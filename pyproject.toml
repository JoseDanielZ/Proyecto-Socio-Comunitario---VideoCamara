[project]
name = "lpr-conjunto"
version = "0.1.0"
description = "Base de reconocimiento de placas (ALPR) para registro de entrada/salida en un conjunto residencial"
requires-python = ">=3.11"
dependencies = [
    "supervision>=0.24.0",
    "trackers>=2.0.0",
    "ultralytics>=8.3.0",
    "fast-alpr>=0.4.0",
    "onnxruntime>=1.18.0",  # fast-alpr no lo declara como dependencia obligatoria
    "opencv-python-headless>=4.10.0",
    "pyyaml>=6.0",
    "huggingface_hub>=0.24.0",  # descarga del detector aéreo (lpr.download_models)
    # Backend del sistema del conjunto (backend/)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "python-dotenv>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "httpx>=0.27"]
preview = ["opencv-python>=4.10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lpr"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["backend"]
norecursedirs = ["_upstream", "casos", ".venv", ".venv-casos", "data", "models", "frontend", "node_modules"]
