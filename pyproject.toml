[project]
name = "lpr-conjunto"
version = "0.1.0"
description = "Base de reconocimiento de placas (ALPR) para registro de entrada/salida en un conjunto residencial"
requires-python = ">=3.11"
dependencies = [
    "supervision>=0.24.0",
    "ultralytics>=8.3.0",
    "fast-alpr>=0.4.0",
    "opencv-python-headless>=4.10.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]
preview = ["opencv-python>=4.10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lpr"]
